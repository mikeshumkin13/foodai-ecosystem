services:
  mailpit:
    image: axllent/mailpit:v1.31.2
    restart: unless-stopped
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_MAX_MESSAGES: "100"
      MP_MAX_AGE: 24h
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,${FOODAI_TEST_HOST:-localhost}
      DJANGO_CORS_ALLOWED_ORIGINS: http://${FOODAI_TEST_HOST:-localhost}:3000
      DJANGO_CSRF_TRUSTED_ORIGINS: http://${FOODAI_TEST_HOST:-localhost}:3000
      DJANGO_CORS_ALLOW_CREDENTIALS: "true"
      DJANGO_SESSION_COOKIE_SECURE: "false"
      DJANGO_CSRF_COOKIE_SECURE: "false"
      FRONTEND_BASE_URL: http://${FOODAI_TEST_HOST:-localhost}:3000
      DJANGO_EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      DJANGO_EMAIL_HOST: mailpit
      DJANGO_EMAIL_PORT: "1025"
      DJANGO_EMAIL_HOST_USER: ""
      DJANGO_EMAIL_HOST_PASSWORD: ""
      DJANGO_EMAIL_USE_TLS: "false"
      DJANGO_EMAIL_USE_SSL: "false"
      DJANGO_EMAIL_TIMEOUT_SECONDS: "10"
      AI_COACH_PROVIDER: mock
      VISION_SERVICE_TIMEOUT_SECONDS: "60"
      CELERY_TASK_SOFT_TIME_LIMIT_SECONDS: "90"
      CELERY_TASK_TIME_LIMIT_SECONDS: "120"
    depends_on:
      mailpit:
        condition: service_healthy
    ports: !override
      - "${FOODAI_TEST_BIND:-127.0.0.1}:8000:8000"

  celery_worker:
    environment:
      VISION_SERVICE_TIMEOUT_SECONDS: "60"
      CELERY_TASK_SOFT_TIME_LIMIT_SECONDS: "90"
      CELERY_TASK_TIME_LIMIT_SECONDS: "120"
