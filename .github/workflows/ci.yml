name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  backend-and-vision:
    name: Backend and Vision checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DJANGO_SECRET_KEY: local-ci-only
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///backend/db.sqlite3
      REDIS_URL: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0+cpu"
          python -m pip install -e ".[dev]"
          python -m pip install -e "services/vision[dev]"

      - name: Ruff
        run: python -m ruff check .

      - name: mypy
        run: python -m mypy backend services/vision

      - name: Django system checks
        run: python backend/manage.py check --settings=config.settings.local

      - name: Pytest
        run: python -m pytest

      - name: Migration check
        run: python backend/manage.py makemigrations --check --dry-run --settings=config.settings.local

      - name: OpenAPI validation
        run: python backend/manage.py spectacular --validate --file /tmp/foodai-openapi.yml --settings=config.settings.local
