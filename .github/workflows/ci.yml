name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: "sqlite:///:memory:"
      REDIS_URL: ""
      CELERY_BROKER_URL: "memory://"
      CELERY_RESULT_BACKEND: "cache+memory://"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Backend lint
        run: python -m ruff check backend

      - name: Backend type checks
        run: python -m mypy backend

      - name: Migration check
        run: python backend/manage.py makemigrations --check --dry-run --settings=config.settings.local

      - name: Django system checks
        run: python backend/manage.py check --settings=config.settings.local

      - name: Backend tests and coverage
        run: >-
          python -m pytest backend
          --ignore=backend/integrations/vision/tests/test_client.py
          -o "addopts=--strict-config --strict-markers --cov=backend
          --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage-backend.xml --cov-fail-under=80"

      - name: OpenAPI validation
        run: python backend/manage.py spectacular --validate --file /tmp/foodai-openapi.yml --settings=config.settings.local

  vision:
    name: Vision checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: "sqlite:///:memory:"
      REDIS_URL: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            services/vision/pyproject.toml

      - name: Install Vision and contract-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0+cpu"
          python -m pip install -e ".[dev]"
          python -m pip install -e "services/vision[dev]"

      - name: Vision lint
        run: python -m ruff check services/vision backend/integrations/vision

      - name: Vision type checks
        run: python -m mypy services/vision backend/integrations/vision

      - name: Vision and backend contract tests
        run: >-
          python -m pytest services/vision/tests
          backend/integrations/vision/tests/test_client.py
          -o "addopts=--strict-config --strict-markers
          --cov=services/vision/vision_service
          --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage-vision.xml --cov-fail-under=80"

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend lint
        working-directory: frontend
        run: pnpm lint

      - name: Frontend type checks
        working-directory: frontend
        run: pnpm typecheck

      - name: Frontend tests
        working-directory: frontend
        run: pnpm test

      - name: Frontend production build
        working-directory: frontend
        run: pnpm build
