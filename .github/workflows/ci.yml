name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  project-memory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint foundation scripts
        run: make lint

      - name: Test project memory
        run: make test

