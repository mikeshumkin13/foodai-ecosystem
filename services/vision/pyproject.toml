[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foodai-vision-service"
version = "0.1.0"
description = "FastAPI vision service foundation for FoodAI Ecosystem"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "Pillow>=11.0,<13.0",
  "pydantic>=2.9,<3.0",
  "torch==2.6.0",
  "transformers>=4.44,<5.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<0.29",
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<0.14",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["vision_service*"]
